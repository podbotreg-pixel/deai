[workspace]
resolver = "2"
members = [
    "crates/dinet-crypto",
    "crates/dinet-proto",
    "crates/dinet-core",
    "crates/dinet-fl",
    "crates/dinet-net",
    "crates/dinet-registry",
    "crates/dinet-node",
    "crates/dinet-memory",
    "crates/dinet-chat",
    "crates/dinet-client",
    "crates/dinet-p2p",
    "crates/dinet-train",
    "crates/dinet-llama",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later OR Apache-2.0"
rust-version = "1.75"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# тесты/сборка отладки: чуть быстрее симуляции (математика FL — численный бенчмарк)
[profile.dev]
opt-level = 1
