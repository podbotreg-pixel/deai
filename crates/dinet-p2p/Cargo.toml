[package]
name = "dinet-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Реальная p2p-сеть DI-NET: libp2p (TCP+Noise+Yamux+gossipsub) под wire-кадрами dinet-proto"

[dependencies]
dinet-crypto = { path = "../dinet-crypto" }
dinet-proto = { path = "../dinet-proto" }
dinet-node = { path = "../dinet-node" }
dinet-registry = { path = "../dinet-registry" }
dinet-fl = { path = "../dinet-fl" }

libp2p = { version = "0.57", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "macros", "mdns"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
futures = "0.3"
libp2p-mdns = "0.49"

[dev-dependencies]
